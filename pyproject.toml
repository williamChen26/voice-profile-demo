[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-profile-demo"
version = "0.1.0"
description = "Local pyannote voice enrollment, verification, diarization and ASR demo"
requires-python = ">=3.10,<3.14"
dependencies = [
  "pyannote.audio==4.0.7",
  "faster-whisper==1.2.1",
  "gradio==6.30.0",
  "silero-vad==6.2.3",
  "python-dotenv>=1,<2",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "soundfile>=0.13,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
voice-demo = "voice_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
